[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archive-ferry"
version = "0.1.0"
description = "Archive your YouTube channel to the Internet Archive (archive.org): resumable, one video at a time, with a local web UI."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "src/archive_ferry/static/fonts/OFL-*.txt"]
requires-python = ">=3.10"
keywords = [
    "youtube",
    "internet-archive",
    "archive.org",
    "yt-dlp",
    "backup",
    "archiving",
    "datahoarder",
    "youtube-channel-backup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    # The deno extra and imageio-ffmpeg bring the JavaScript runtime and ffmpeg,
    # so users do not install them or change PATH.
    "yt-dlp[default,deno]>=2025.11.12",
    "imageio-ffmpeg>=0.6",
    "internetarchive>=5.0",
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/Abusadat18/archive-ferry"
Issues = "https://github.com/Abusadat18/archive-ferry/issues"

[project.scripts]
archive-ferry = "archive_ferry.cli:app"
# The project was called ytia before; the old command keeps working.
ytia = "archive_ferry.cli:app"

[project.gui-scripts]
archive-ferry-ui = "archive_ferry.web:main"
ytia-ui = "archive_ferry.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/archive_ferry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
