[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytia"
version = "0.1.0"
description = "Mirror a YouTube channel to the Internet Archive, one video at a time, with pause, resume and resync."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["youtube", "internet-archive", "archive.org", "yt-dlp", "backup"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "internetarchive>=5.0",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
ytia = "ytia.cli:app"

[project.gui-scripts]
ytia-ui = "ytia.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ytia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
